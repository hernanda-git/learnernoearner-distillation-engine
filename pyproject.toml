[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus-distillation-engine"
version = "0.1.0"
description = "Air-gapped cognitive distillation and autonomous behavioral clone engine for @learnernoearner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Hernanda" }]
dependencies = ["websockets>=13,<16"]

[project.optional-dependencies]
lakehouse = ["duckdb>=1.0.0", "pyarrow>=16.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
